name: Generate recents manifest

on:
  push:
    branches: [main]
    paths:
      - 'images/recents/**'
  workflow_dispatch:

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          cd images/recents
          {
            echo '['
            first=true
            while IFS= read -r f; do
              if [ "$first" = true ]; then first=false; else echo ','; fi
              printf '"%s"' "$f"
            done < <(find . -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) -printf '%f\n' | sort)
            echo ']'
          } > manifest.json
          cat manifest.json

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/recents/manifest.json
          git diff --staged --quiet || git commit -m "chore: update recents manifest [skip ci]"
          git push